[project]
name = "parkvision-engine"
version = "0.1.0"
description = "Computer vision engine for intelligent parking management"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "numpy>=2.5.4,<3.0",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pytest==9.1.1",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
